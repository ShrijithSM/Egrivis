[project]
name = "egrivis"
version = "0.1.0"
description = "Adaptive evacuation simulation under uncertainty"
requires-python = ">=3.12,<3.13"
dependencies = ["jupedsim==1.4.2", "matplotlib>=3.10,<4"]

[dependency-groups]
dev = ["pytest>=8,<9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/egrivis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
